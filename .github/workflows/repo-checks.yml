# CI for the repository's own consistency checks (scripts/check-*.mjs).
#
# Most of this repo is prose — the skills, the commands, the references, the docs — and prose is where
# its defects live: a registry row naming a stage the skill no longer runs in, a hand-counted count
# that has gone stale, a link to a file somebody renamed, a skill that quietly grew past its budget.
#
# Six checks, and every one of them must exit 0. There is no ratchet and no baseline file: the
# write-table check and the counters it carried are gone, so a number in this workflow is never
# something a contributor edits to make a build green.
#
# Deliberately NOT path-filtered. These checks read the whole tree, and the drift they catch is usually
# introduced by a file far from the claim it invalidates. Filtering by path would reintroduce exactly
# the blind spot this exists to close.
#
# Every check runs even after one fails (`if: ${{ !cancelled() }}`), so a contributor sees the full
# list in one run instead of fixing them one build at a time.
name: repo-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: repo consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Each catches a different shape of drift and none subsumes another.
      - name: envelope — every SKILL.md has the eight body sections, in order, under a Stage line
        if: ${{ !cancelled() }}
        run: node scripts/check-envelope.mjs

      - name: registries — no registry lists a skill that is not there, and none omits one
        if: ${{ !cancelled() }}
        run: node scripts/check-registries.mjs

      - name: references — every relative link resolves to a file that exists
        if: ${{ !cancelled() }}
        run: node scripts/check-references.mjs

      - name: enumerations — every hand-written count matches what is actually there
        if: ${{ !cancelled() }}
        run: node scripts/check-enumerations.mjs

      - name: stages — the stage a registry assigns matches the stage the skill declares
        if: ${{ !cancelled() }}
        run: node scripts/check-stages.mjs

      - name: budget — no skill, reference or command is over its ceiling
        if: ${{ !cancelled() }}
        run: node scripts/check-budget.mjs
